<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- LPoster Custom Logo: rounded square with "LP" monogram -->
  <defs>
    <linearGradient id="lpGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6c5ce7"/>
      <stop offset="100%" stop-color="#00d2a8"/>
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#lpGrad)"/>
  <text x="32" y="42" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="bold"
    fill="#ffffff" text-anchor="middle">LP</text>
</svg>
